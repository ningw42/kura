builds:
  exclude: []
  include:
    - "packages.x86_64-linux.*"
    # aarch64-darwin is intentionally not built by default — few kura
    # packages target macOS. Add specific paths here to opt in, e.g.:
    #   - "packages.aarch64-darwin.some-package"
    - "packages.aarch64-darwin.fzf"
    - "packages.aarch64-darwin.lazygit"
    - "packages.aarch64-darwin.moor"
    - "packages.aarch64-darwin.skim"
  branch: master
