name: Build & Push to Caches
# Builds package outputs that changed since the latest successful run and
# pushes their closures to two caches in parallel: Cachix (kura.cachix.org)
# and our self-hosted Attic at cache.ningwang.me/kura. `matrix.nix` is the
# source of truth for what to build per platform and compares exact Nix output
# paths, rather than inferring affected packages from changed source paths.
#
# Setup required (one-time):
#   1. Create the `kura` cache on https://app.cachix.org, generate an auth
#      token, and add it as the `CACHIX_AUTH_TOKEN` repo secret.
#   2. On the Attic server, mint a push+pull token scoped to `kura` (e.g.
#      `atticd-atticadm make-token --sub gha --validity 1y --push kura
#      --pull kura`) and add it as the `ATTIC_TOKEN` repo secret.
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "pkgs/**"
      - "flake.nix"
      - "flake.lock"
      - "matrix.nix"
      - ".github/workflows/build-and-push-to-caches.yml"
concurrency:
  group: build-and-cache-${{ github.ref }}
  cancel-in-progress: false
permissions:
  actions: read
  contents: read
jobs:
  discover:
    name: Discover packages from matrix.nix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build matrix from matrix.nix
        id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Compare against the last run that successfully populated both
          # caches, not github.event.before. The latter can miss an update if
          # an intermediate run failed or was replaced while pending.
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            baseline_sha=$(
              gh api --method GET \
                "/repos/$GITHUB_REPOSITORY/actions/workflows/build-and-push-to-caches.yml/runs" \
                -f branch="$GITHUB_REF_NAME" \
                -f status=success \
                -f per_page=1 \
                --jq '.workflow_runs[0].head_sha // empty'
            )

            if [[ -n "$baseline_sha" ]]; then
              if ! git cat-file -e "$baseline_sha^{commit}" 2>/dev/null; then
                git fetch --no-tags --depth=1 origin "$baseline_sha"
              fi
              export KURA_PREVIOUS_FLAKE="$RUNNER_TEMP/kura-previous"
              git worktree add --detach "$KURA_PREVIOUS_FLAKE" "$baseline_sha"
              echo "Baseline: $baseline_sha"
            else
              echo "No successful baseline; building the full matrix"
            fi
          else
            echo "Manual dispatch; building the full matrix"
          fi

          # matrix.nix holds the build list, wildcard expansion, system→runner
          # mapping, and exact output-path comparison in a single evaluation.
          matrix_json=$(nix eval --json --impure --expr '
            let
              previousPath = builtins.getEnv "KURA_PREVIOUS_FLAKE";
            in
            import ./matrix.nix {
              self = builtins.getFlake (toString ./.);
              previous =
                if previousPath == "" then
                  null
                else
                  builtins.getFlake previousPath;
            }
          ')
          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"
          echo "Matrix: $matrix_json"
  build:
    name: build ${{ matrix.package }} (${{ matrix.system }})
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # Sets up `kura.cachix.org` as a substituter and launches Cachix's
      # daemon/post-build-hook mode, so only paths Nix builds locally are
      # pushed. Attic uses the same path-discovery mode below.
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: kura
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Registers cache.ningwang.me/kura as a substituter and discovers paths
      # through the same post-build-hook mechanism Cachix uses, avoiding paths
      # merely substituted from cache.nixos.org.
      - name: Setup Attic
        uses: ningw42/attic-action@v0.6.0
        with:
          endpoint: ${{ secrets.ATTIC_ENDPOINT }}
          cache: ${{ secrets.ATTIC_CACHE }}
          token: ${{ secrets.ATTIC_TOKEN }}
          path-discovery-mode: post-build-hook
      - name: Build ${{ matrix.package }}
        run: nix build --print-build-logs ".#packages.${{ matrix.system }}.${{ matrix.package }}"
