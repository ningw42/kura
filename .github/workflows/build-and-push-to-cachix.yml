name: Build & Push to Cachix
# Mirror of the Garnix pipeline that pushes to two secondary caches in
# parallel: Cachix (kura.cachix.org) and our self-hosted Attic at
# cache.ningwang.me/kura. Keeps `garnix.yaml` as the source of truth for what
# to build per platform: the discovery job parses `builds.include` and fans
# the matrix out from there.
#
# Setup required (one-time):
#   1. Create the `kura` cache on https://app.cachix.org, generate an auth
#      token, and add it as the `CACHIX_AUTH_TOKEN` repo secret.
#   2. On the Attic server, mint a push+pull token scoped to `kura` (e.g.
#      `atticd-atticadm make-token --sub gha --validity 1y --push kura
#      --pull kura`) and add it as the `ATTIC_TOKEN` repo secret.
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "pkgs/**"
      - "flake.nix"
      - "flake.lock"
      - "garnix.yaml"
      - ".github/workflows/build-and-push-to-cachix.yml"
concurrency:
  group: build-and-cache-${{ github.ref }}
  cancel-in-progress: false
jobs:
  discover:
    name: Discover packages from garnix.yaml
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.matrix.outputs.linux }}
      darwin: ${{ steps.matrix.outputs.darwin }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build matrix from garnix.yaml
        id: matrix
        run: |
          set -euo pipefail

          # Parse `builds.include` from garnix.yaml into one attr-path per line.
          mapfile -t includes < <(yq -r '.builds.include[]' garnix.yaml)

          # For each entry, expand `packages.<system>.*` wildcards by evaluating
          # the flake; pass through specific `packages.<system>.<name>` entries
          # as-is. Group by system so each platform gets its own matrix.
          linux=()
          darwin=()
          for entry in "${includes[@]}"; do
            case "$entry" in
              packages.x86_64-linux.\*)
                while IFS= read -r name; do
                  linux+=("$name")
                done < <(nix eval --json '.#packages.x86_64-linux' \
                  --apply 'builtins.attrNames' | jq -r '.[]')
                ;;
              packages.x86_64-linux.*)
                linux+=("${entry#packages.x86_64-linux.}")
                ;;
              packages.aarch64-darwin.\*)
                while IFS= read -r name; do
                  darwin+=("$name")
                done < <(nix eval --json '.#packages.aarch64-darwin' \
                  --apply 'builtins.attrNames' | jq -r '.[]')
                ;;
              packages.aarch64-darwin.*)
                darwin+=("${entry#packages.aarch64-darwin.}")
                ;;
              *)
                echo "::warning::ignoring unsupported garnix include: $entry"
                ;;
            esac
          done

          linux_json=$(printf '%s\n' ${linux[@]+"${linux[@]}"} | jq -R . | jq -sc 'map(select(length>0))')
          darwin_json=$(printf '%s\n' ${darwin[@]+"${darwin[@]}"} | jq -R . | jq -sc 'map(select(length>0))')
          echo "linux=$linux_json"   >> "$GITHUB_OUTPUT"
          echo "darwin=$darwin_json" >> "$GITHUB_OUTPUT"
          echo "Linux:  $linux_json"
          echo "Darwin: $darwin_json"
  build-linux:
    name: build ${{ matrix.package }} (x86_64-linux)
    needs: discover
    if: needs.discover.outputs.linux != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.linux) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # Sets up `kura.cachix.org` as a substituter AND launches `cachix
      # watch-store` in the background — any path that lands in /nix/store
      # during this job is pushed to the cache automatically. That's why
      # there's no explicit `cachix push` step.
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: kura
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Registers cache.ningwang.me/kura as a substituter; we disable its
      # auto-push because the action pushes EVERY new store path including
      # nixpkgs build deps already on cache.nixos.org. Our own push step
      # below filters those out (matching Cachix's behavior).
      - name: Setup Attic
        uses: ryanccn/attic-action@v0.5.0
        with:
          endpoint: https://cache.ningwang.me/
          cache: kura
          token: ${{ secrets.ATTIC_TOKEN }}
          skip-push: "true"
      - name: Snapshot store before build (for Attic push diff)
        run: nix path-info --all | sort -u > "$RUNNER_TEMP/store-before.txt"
      - name: Build ${{ matrix.package }}
        run: nix build --print-build-logs ".#packages.x86_64-linux.${{ matrix.package }}"
      - name: Push to Attic (skip paths already in cache.nixos.org)
        # Filters out anything already on cache.nixos.org so Attic only stores
        # what consumers can't get for free. Failures here become warnings,
        # not job failures, so a transient Attic/B2 hiccup can't prevent
        # Cachix's post-step push from running.
        continue-on-error: true
        run: |
          set -uo pipefail

          # 1. New store paths added during this job (build + its substitutes).
          nix path-info --all | sort -u > "$RUNNER_TEMP/store-after.txt"
          comm -23 \
            "$RUNNER_TEMP/store-after.txt" \
            "$RUNNER_TEMP/store-before.txt" \
            > "$RUNNER_TEMP/new-paths.txt"
          new_count=$(wc -l < "$RUNNER_TEMP/new-paths.txt")
          echo "::notice::Build added $new_count new store path(s)"

          if [[ "$new_count" -eq 0 ]]; then
            echo "Nothing to push."
            exit 0
          fi

          # 2. Ask cache.nixos.org which of those it already has, in one shot.
          # nix path-info --store returns only the paths the store has; missing
          # ones become a non-zero exit, which we tolerate via `|| true`.
          xargs nix path-info --json --store https://cache.nixos.org \
            < "$RUNNER_TEMP/new-paths.txt" 2>/dev/null \
            | jq -r 'keys[]' | sort -u \
            > "$RUNNER_TEMP/upstream-has.txt" || true
          upstream_count=$(wc -l < "$RUNNER_TEMP/upstream-has.txt")

          # 3. Difference = what Attic actually needs to store.
          comm -23 \
            "$RUNNER_TEMP/new-paths.txt" \
            "$RUNNER_TEMP/upstream-has.txt" \
            > "$RUNNER_TEMP/to-push.txt"
          push_count=$(wc -l < "$RUNNER_TEMP/to-push.txt")

          echo "::notice::$new_count new, $upstream_count already on cache.nixos.org, $push_count to push to Attic"

          echo "::group::Paths skipped (already on cache.nixos.org)"
          cat "$RUNNER_TEMP/upstream-has.txt"
          echo "::endgroup::"

          echo "::group::Paths to push to Attic"
          cat "$RUNNER_TEMP/to-push.txt"
          echo "::endgroup::"

          if [[ "$push_count" -eq 0 ]]; then
            echo "Nothing to push after filter."
            exit 0
          fi

          attic push --stdin kura < "$RUNNER_TEMP/to-push.txt"
  build-darwin:
    name: build ${{ matrix.package }} (aarch64-darwin)
    needs: discover
    if: needs.discover.outputs.darwin != '[]'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.darwin) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: kura
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Setup Attic
        uses: ryanccn/attic-action@v0.5.0
        with:
          endpoint: https://cache.ningwang.me/
          cache: kura
          token: ${{ secrets.ATTIC_TOKEN }}
          skip-push: "true"
      - name: Snapshot store before build (for Attic push diff)
        run: nix path-info --all | sort -u > "$RUNNER_TEMP/store-before.txt"
      - name: Build ${{ matrix.package }}
        run: nix build --print-build-logs ".#packages.aarch64-darwin.${{ matrix.package }}"
      - name: Push to Attic (skip paths already in cache.nixos.org)
        continue-on-error: true
        run: |
          set -uo pipefail

          nix path-info --all | sort -u > "$RUNNER_TEMP/store-after.txt"
          comm -23 \
            "$RUNNER_TEMP/store-after.txt" \
            "$RUNNER_TEMP/store-before.txt" \
            > "$RUNNER_TEMP/new-paths.txt"
          new_count=$(wc -l < "$RUNNER_TEMP/new-paths.txt")
          echo "::notice::Build added $new_count new store path(s)"

          if [[ "$new_count" -eq 0 ]]; then
            echo "Nothing to push."
            exit 0
          fi

          xargs nix path-info --json --store https://cache.nixos.org \
            < "$RUNNER_TEMP/new-paths.txt" 2>/dev/null \
            | jq -r 'keys[]' | sort -u \
            > "$RUNNER_TEMP/upstream-has.txt" || true
          upstream_count=$(wc -l < "$RUNNER_TEMP/upstream-has.txt")

          comm -23 \
            "$RUNNER_TEMP/new-paths.txt" \
            "$RUNNER_TEMP/upstream-has.txt" \
            > "$RUNNER_TEMP/to-push.txt"
          push_count=$(wc -l < "$RUNNER_TEMP/to-push.txt")

          echo "::notice::$new_count new, $upstream_count already on cache.nixos.org, $push_count to push to Attic"

          echo "::group::Paths skipped (already on cache.nixos.org)"
          cat "$RUNNER_TEMP/upstream-has.txt"
          echo "::endgroup::"

          echo "::group::Paths to push to Attic"
          cat "$RUNNER_TEMP/to-push.txt"
          echo "::endgroup::"

          if [[ "$push_count" -eq 0 ]]; then
            echo "Nothing to push after filter."
            exit 0
          fi

          attic push --stdin kura < "$RUNNER_TEMP/to-push.txt"
