name: Auto-update packages
# Scheduled run of `nix run .#update -- --skip-prompt`. Leaves the resulting
# version/lockfile bumps as unstaged changes, summarizes them into a
# conventional-commit title + markdown table, and opens (or updates) a single
# PR at `auto-update/packages`. Each scheduled run force-pushes onto that
# branch, so an open PR is always the current state of the world.

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2,14 * * *" # twice daily 02:15 and 14:15 UTC
  push:
    branches:
      - master
    paths:
      - ".github/workflows/auto-update-packages.yml"
      - ".github/scripts/summarize-package-updates.py"
# The default token is only used for checkout and authenticated source reads.
permissions:
  contents: read
concurrency:
  group: auto-update-packages
  cancel-in-progress: false
jobs:
  update:
    # Only trusted master runs may use the PAT to publish update PRs.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # The updater wrapper in flake.nix bridges
      # ~/.config/nix/access-tokens.conf -> GITHUB_TOKEN, but only when the
      # env var is unset. Setting it here passes through unchanged and gives
      # downstream nix-update calls the 5000/hr authenticated rate limit.
      - name: Run updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Stop before creating a PR rather than commit a failed package's partial edits.
        run: nix run .#update -- --skip-prompt --no-keep-going
      # Some hooks (e.g. regen-npm-lockfile) regenerate files that don't
      # match treefmt style; this keeps the PR diff clean.
      - name: Format
        run: nix fmt
      - name: Summarize changes
        id: changeset
        run: ./.github/scripts/summarize-package-updates.py
      # PAT-created PR events run CI without the GITHUB_TOKEN approval gate.
      # Do not fall back to GITHUB_TOKEN if the secret is missing or expired.
      - name: Create or update PR
        id: pr
        if: steps.changeset.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AUTO_UPDATE_PAT }}
          branch: auto-update/packages
          delete-branch: true
          commit-message: ${{ steps.changeset.outputs.title }}
          title: ${{ steps.changeset.outputs.title }}
          body: ${{ steps.changeset.outputs.body }}
      # The master ruleset makes auto-merge wait for Package build validation.
      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.AUTO_UPDATE_PAT }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: gh pr merge "$PR_URL" --repo "$GITHUB_REPOSITORY" --auto --squash
